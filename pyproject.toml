[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tenets-meter"
version = "0.1.0"
description = "Measure an AI run against the Four Tenets: Cost, Bridge, Work, Theory (each as low as possible)."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Joshua Almeida"}]
requires-python = ">=3.8"
dependencies = []
keywords = ["ai", "agents", "ai-rules", "metrics"]

[project.urls]
Homepage = "https://fitzyracing1.github.io/ai-tenets/"
Repository = "https://github.com/fitzyracing1/ai-tenets"

[project.scripts]
tenets-meter = "tenets_meter.cli:main"

[tool.setuptools]
packages = ["tenets_meter"]
